<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse to Film</title>
<style>
  :root { --bg:#f6f2ea; --panel:#fffdf8; --line:#e2dacb; --text:#2a2622; --muted:#7d7468; --accent:#8a3b2e; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --panel:#1f1c16; --line:#383227; --text:#efe9df; --muted:#a39985; --accent:#e08a6f; --err:#ff7b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:36px 16px 72px; }
  h1 { font:italic 600 30px/1.1 Georgia,serif; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:12px; }
  textarea, input, select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { width:100%; min-height:150px; resize:vertical; font:italic 17px/1.6 Georgia,serif; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:end; }
  label { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  .grow { flex:1 1 220px; } .grow input { width:100%; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:12px; color:var(--muted); }
  .banner { margin-top:12px; padding:10px 12px; border:1px solid var(--err); color:var(--err); border-radius:8px; display:none; }
  .poem { margin-top:28px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .poem h2 { font-size:13px; font-weight:600; color:var(--muted); margin:0 0 12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .film video { width:100%; border-radius:8px; background:#000; max-height:560px; }
  .clips { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:14px; }
  .clip { border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:8px; align-content:start; }
  .clip q { font:italic 15px/1.4 Georgia,serif; quotes:none; }
  .clip video { width:100%; border-radius:6px; background:#000; }
  .ph { aspect-ratio:16/9; border-radius:6px; background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px); display:grid; place-items:center; font-size:11px; color:var(--muted); }
  .pill { font-size:11px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:99px; border:1px solid currentColor; justify-self:start; }
  .WAITING, .IN_QUEUE { color:#3b6ea5; } .IN_PROGRESS { color:#a56d00; } .DONE { color:#2f7d32; } .FAILED { color:var(--err); }
  .spin { width:9px; height:9px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; display:inline-block; animation:s 1s linear infinite; margin-right:4px; vertical-align:-1px; }
  @keyframes s { to { transform:rotate(360deg); } }
  a { color:var(--accent); font-size:13px; }
  .err { color:var(--err); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>Verse to Film</h1>
  <p class="sub">Paste a short poem. Each line becomes its own clip with the words on screen, then the clips are joined into one film. Generated with <code id="model">…</code> via Comfy Router.</p>

  <form id="f">
    <textarea id="poem" required>The fog comes
on little cat feet.
It sits looking
over harbor and city</textarea>
    <div class="row">
      <label class="grow">Visual style (applied to every line)<input id="style" value="Muted film photography, soft dawn light, slow camera drift"></label>
      <label>Aspect<select id="aspect_ratio"></select></label>
      <label>Seconds per line<select id="duration"></select></label>
      <button id="go">Make film</button>
    </div>
    <div class="hint" id="hint"></div>
  </form>
  <div class="banner" id="banner"></div>
  <div id="poems"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const LABEL = { WAITING:"WAITING", IN_QUEUE:"QUEUED", IN_PROGRESS:"RUNNING", DONE:"FINISHED", FAILED:"FAILED" };
const LIVE = (s) => s === "WAITING" || s === "IN_QUEUE" || s === "IN_PROGRESS";
let MAX = 8;

function banner(m) { $("banner").style.display = m ? "block" : "none"; $("banner").textContent = m || ""; }
function lines() { return $("poem").value.split("\n").map(s => s.trim()).filter(Boolean); }
function hint() {
  const n = lines().length;
  $("hint").textContent = `${n} line${n === 1 ? "" : "s"} → ${n} clip${n === 1 ? "" : "s"}` + (n > MAX ? ` (max ${MAX})` : "") + " · each clip is one generation billed to your workspace";
}
$("poem").addEventListener("input", hint);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(p) {
  let box = document.getElementById("p-" + p.id);
  if (!box) { box = el("section", "poem"); box.id = "p-" + p.id; $("poems").prepend(box); }
  box.innerHTML = "";
  const done = p.clips.filter(c => c.state === "DONE").length;
  const h = el("h2"); h.append(`${done} of ${p.clips.length} clips finished · ${p.aspect_ratio} · ${p.duration}s per line`);
  box.append(h);
  if (p.film) {
    const f = el("div", "film"); const v = el("video"); v.src = p.film; v.controls = true; v.playsInline = true;
    const a = el("a", null, "Download full film (MP4)"); a.href = "/download/" + p.film.split("/").pop();
    f.append(v, a); box.append(f);
  }
  const grid = el("div", "clips");
  p.clips.forEach((c) => {
    const card = el("div", "clip");
    const pill = el("span", "pill " + c.state);
    if (LIVE(c.state)) pill.append(el("span", "spin"));
    pill.append(LABEL[c.state] || c.state);
    if (c.state === "IN_QUEUE" && c.queue_position != null) pill.append(` · #${c.queue_position}`);
    card.append(el("q", null, c.line));
    if (c.state === "DONE") {
      const v = el("video"); v.src = c.file; v.controls = true; v.playsInline = true; v.muted = true;
      const a = el("a", null, "Download clip"); a.href = "/download/" + c.file.split("/").pop();
      card.append(v, pill, a);
    } else {
      const ph = el("div", "ph", c.state === "FAILED" ? "no clip" : "generating…");
      ph.style.aspectRatio = p.aspect_ratio.replace(":", "/");
      card.append(ph, pill);
      if (c.state === "FAILED") card.append(el("div", "err", `error_type: ${c.error_type}${c.error ? " — " + c.error : ""}`));
    }
    grid.append(card);
  });
  box.append(grid);
}

async function poll(id) {
  let next = 6000;
  try {
    const r = await fetch("/api/poems/" + id);
    const j = await r.json();
    if (r.status === 402) { banner(j.detail); if (j.poem) render(j.poem); return; }
    if (!r.ok) throw new Error(j.detail);
    render(j);
    if (!j.clips.some(c => LIVE(c.state))) return;
  } catch (e) { next = 10000; }
  setTimeout(() => poll(id), next);
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); banner("");
  if (lines().length > MAX) { banner(`Keep it to ${MAX} lines or fewer.`); return; }
  $("go").disabled = true;
  try {
    const r = await fetch("/api/poems", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ poem:$("poem").value, style:$("style").value, aspect_ratio:$("aspect_ratio").value, duration:+$("duration").value }) });
    const j = await r.json();
    if (r.status === 402) { banner(j.detail); if (j.poem) { render(j.poem); poll(j.poem.id); } return; }
    if (!r.ok) { banner(typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail)); return; }
    render(j); poll(j.id);
  } finally { $("go").disabled = false; }
});

(async () => {
  const h = await (await fetch("/api/health")).json();
  MAX = h.max_lines; hint();
  $("model").textContent = h.model;
  for (const f of h.formats) $("aspect_ratio").append(new Option(f, f));
  for (const d of h.durations) $("duration").append(new Option(`${d}s`, d, false, d === h.default_duration));
  if (!h.key_present) banner(`COMFY_API_KEY is missing. Put it in ${h.env_path} and restart the server.`);
  for (const p of (await (await fetch("/api/poems")).json()).reverse()) {
    render(p); if (p.clips.some(c => LIVE(c.state))) poll(p.id);
  }
})();
</script>
</body>
</html>
